[project]
name = "audoryn-backend"
version = "26.2.0"
description = "Aduoryn core API: people, conversations, approvals, workers and jobs, plans, integration setup"
requires-python = ">=3.13"
# The libraries are in packages/shared, installed with this package (see README.md): the core
# needs nothing more. The execution service is services/execution.
dependencies = []

[project.optional-dependencies]
dev = [
  "pyright>=1.1.405,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.13,<1",
]

[tool.pytest.ini_options]
pythonpath = [".", "../packages/shared", "../services/execution"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint.isort]
# AgentGate's three packages (Phase 4): the core, the shared code and the execution service.
known-first-party = ["app", "audoryn_shared", "audoryn_execution"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
# The core, and the shared and execution packages it is tested with (the tests are here).
include = ["app", "tests", "../packages/shared/audoryn_shared", "../services/execution/audoryn_execution"]
# Those packages, and the gateway's route table (tests/test_gateway_route_contract.py).
extraPaths = ["../packages/shared", "../services/execution", "../services/gateway"]
# The context engine is new code, held to strict typing (context-quality-fix-plan, 4.3).
strict = ["../packages/shared/audoryn_shared/application/context"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
