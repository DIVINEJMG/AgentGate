services:
  - type: web
    name: audoryn-api-staging
    runtime: python
    branch: main
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_QSTASH_URL
        sync: false
      - key: UPSTASH_QSTASH_TOKEN
        sync: false
      - key: UPSTASH_QSTASH_CURRENT_SIGNING_KEY
        sync: false
      - key: UPSTASH_QSTASH_NEXT_SIGNING_KEY
        sync: false
      - key: QSTASH_FAILURE_CALLBACK_URL
        value: https://audoryn-api-staging.onrender.com/internal/v1/runtime/failures
      - key: UPSTASH_BLOB_BUCKET
        sync: false
      - key: UPSTASH_BLOB_TOKEN
        sync: false
      - key: OBJECT_STORAGE_PROVIDER
        value: upstash_blob
      - key: CUTOVER_STAGE
        value: system
      - key: SHADOW_MODE_ENABLED
        value: "true"
      - key: RUNTIME_EXECUTION_ENABLED
        value: "false"
