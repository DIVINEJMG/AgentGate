services:
  - type: web
    name: audoryn-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RUNTIME_EXECUTION_ENABLED
        value: "false"

  - type: worker
    name: audoryn-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: python -m app.runtime.worker
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RUNTIME_EXECUTION_ENABLED
        value: "false"

  - type: cron
    name: audoryn-scheduler
    runtime: python
    rootDir: backend
    schedule: "*/5 * * * *"
    buildCommand: pip install -e .
    startCommand: python -m app.runtime.scheduler
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

databases:
  - name: audoryn-postgres
