services:
  - type: web
    name: audoryn-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_MIGRATE_ON_STARTUP
        value: "false"
      - key: REDIS_URL
        sync: false
      - key: QSTASH_URL
        sync: false
      - key: QSTASH_TOKEN
        sync: false
      - key: QSTASH_CURRENT_SIGNING_KEY
        sync: false
      - key: QSTASH_NEXT_SIGNING_KEY
        sync: false
      - key: QSTASH_OUTBOX_DRAIN_URL
        sync: false
      - key: QSTASH_RUNTIME_EXECUTE_URL
        sync: false
      - key: QSTASH_RUNTIME_SWEEP_URL
        sync: false
      - key: UPSTASH_BLOB_BUCKET
        sync: false
      - key: UPSTASH_BLOB_TOKEN
        sync: false
      - key: AI_ENABLED
        value: "false"
      - key: AI_PROVIDER
        value: nvidia_nim
      - key: AI_PROVIDER_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: AI_PROVIDER_API_KEY
        sync: false
      - key: AI_COORDINATOR_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: AI_VISION_MODEL
        value: nvidia/ising-calibration-1.5-31b
      - key: AI_TIMEOUT_SECONDS
        value: "60"
      - key: AI_MAX_RETRIES
        value: "2"
      - key: AI_MAX_OUTPUT_TOKENS
        value: "1800"
      - key: CONVERSATION_ATTACHMENT_MAX_BYTES
        value: "10485760"
      - key: CONVERSATION_ATTACHMENT_TEXT_MAX_CHARS
        value: "100000"
      - key: VISION_SIGNED_URL_TTL_SECONDS
        value: "300"
      - key: CUTOVER_STAGE
        value: runtime
      - key: RUNTIME_EXECUTION_ENABLED
        value: "true"
