services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: audoryn
      POSTGRES_USER: audoryn
      POSTGRES_PASSWORD: audoryn
    ports:
      - "5432:5432"
    volumes:
      - audoryn_postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - audoryn_minio:/data

volumes:
  audoryn_postgres:
  audoryn_minio:
