name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check app tests migrations
      - run: ruff format --check app/application/services/data_migration.py app/application/services/cutover_gate.py tests/test_f28_21_26.py
      - run: ruff format --check app/execution app/integrations/builtin.py app/api/integration_capability_routes.py tests/test_f29_0_10.py
      - run: pyright
      - run: pytest
      - run: pytest tests/test_security_invariants.py
      - run: pytest tests/parity
      - run: pytest tests/contract
      - run: alembic upgrade head --sql > /tmp/audoryn-schema.sql
      - run: python ../scripts/verify_no_legacy_platform.py
      - run: python ../scripts/verify_f27_boundaries.py
      - run: python ../scripts/verify_f28_architecture.py
      - run: python ../scripts/audit_f28_endpoints.py --check --require-complete
      - run: python ../scripts/verify_f28_baseline.py
      - run: python ../scripts/verify_f28_persistence.py
      - run: python ../scripts/verify_f28_redis_boundaries.py
      - run: python ../scripts/verify_f28_action_gateway.py
      - run: python ../scripts/verify_f28_api_parity.py
      - run: python ../scripts/verify_f28_contracts.py
      - run: python ../scripts/verify_f28_11_20.py
      - run: python ../scripts/verify_f28_security_invariants.py
      - run: python ../scripts/verify_f28_21_26.py
      - run: python ../scripts/verify_f29_0_10.py
      - run: python ../scripts/verify_f29_31_40.py
      - run: python ../scripts/verify_f30_0_10.py
      - run: python ../scripts/verify_f30_11_20.py
      - run: python ../scripts/verify_f30_21_30.py
      - run: python ../scripts/verify_f30_31_40.py
      - run: python ../scripts/verify_f30_ui_exposure.py
      - run: python ../scripts/verify_qstash_runtime_cutover.py
