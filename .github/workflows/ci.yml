name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    services:
      redis:  # the limit counters and shared drains are tested against a real Redis
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      GATEWAY_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pyright
      - run: pytest

  # Each service installed alone, as its image installs it (Phase 4): the core without the
  # execution service or Playwright, the execution service without the core.
  core-alone:
    runs-on: ubuntu-latest
    env:
      SERVICE_ROLE: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install "./packages/shared[coding]" "./backend[dev]"
      - run: python -c "import importlib.util as u, sys; sys.exit(any(u.find_spec(m) for m in ('playwright', 'audoryn_execution')))"
      - working-directory: backend
        run: python -c "from app.main import app; print(len(app.routes), 'routes')"
      - working-directory: backend
        run: pytest -o pythonpath=. tests/test_message_contracts.py tests/test_health.py

  execution-alone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install "./packages/shared[coding]" "./services/execution[dev]"
      - run: python -c "import importlib.util as u, sys; sys.exit(u.find_spec('app') is not None)"
      - working-directory: services/execution
        run: pytest

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the changed-code quality guard compares with the base branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      # The core, with the shared code and the execution service it is tested with (Phase 4).
      - run: pip install -e "../packages/shared[coding]" -e ../services/execution -e ".[dev]"
      - run: ruff check app tests migrations scripts ../packages/shared ../services/execution
      - run: python scripts/check_changed_quality.py --base origin/${{ github.base_ref || 'main' }}
      - run: ruff format --check ../packages/shared/audoryn_shared/application/services/data_migration.py ../packages/shared/audoryn_shared/application/services/cutover_gate.py tests/test_f28_21_26.py
      - run: ruff format --check ../packages/shared/audoryn_shared/execution ../services/execution/audoryn_execution/execution ../packages/shared/audoryn_shared/integrations/builtin.py ../packages/shared/audoryn_shared/api/integration_capability_routes.py tests/test_f29_0_10.py
      - run: pyright
      - run: pytest
      - run: pytest tests/test_f31_0_10.py
      - run: pytest tests/test_f31_11_20.py
      - run: pytest tests/test_f31_21_30.py
      - run: pytest tests/test_f31_31_40.py
      - run: pytest tests/test_security_invariants.py
      - run: pytest tests/parity
      - run: pytest tests/contract
      - run: alembic upgrade head --sql > /tmp/audoryn-schema.sql
      - run: python ../scripts/verify_no_legacy_platform.py
      - run: python ../scripts/verify_f27_boundaries.py
      - run: python ../scripts/verify_f28_architecture.py
      - run: python ../scripts/audit_f28_endpoints.py --check --require-complete
      - run: python ../scripts/verify_f28_baseline.py
      - run: python ../scripts/verify_f28_persistence.py
      - run: python ../scripts/verify_f28_redis_boundaries.py
      - run: python ../scripts/verify_f28_action_gateway.py
      - run: python ../scripts/verify_f28_api_parity.py
      - run: python ../scripts/verify_f28_contracts.py
      - run: python ../scripts/verify_f28_11_20.py
      - run: python ../scripts/verify_f28_security_invariants.py
      - run: python ../scripts/verify_f28_21_26.py
      - run: python ../scripts/verify_f29_0_10.py
      - run: python ../scripts/verify_f29_31_40.py
      - run: python ../scripts/verify_f30_0_10.py
      - run: python ../scripts/verify_f30_11_20.py
      - run: python ../scripts/verify_f30_21_30.py
      - run: python ../scripts/verify_f30_31_40.py
      - run: python ../scripts/verify_f30_ui_exposure.py
      - run: python ../scripts/verify_f31_0_10.py
      - run: python ../scripts/verify_f31_11_20.py
      - run: python ../scripts/verify_f31_21_30.py
      - run: python ../scripts/verify_f31_31_40.py
      - run: python ../scripts/verify_secret_hygiene.py
      - run: python ../scripts/verify_worker_autonomy_authority.py
      - run: python ../scripts/verify_conversation_authority.py
      - run: python ../scripts/verify_ai_provider_boundary.py
      - run: python ../scripts/verify_qstash_runtime_cutover.py
