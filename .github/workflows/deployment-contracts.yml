name: Deployment contracts

on:
  pull_request:
  push:
    branches: [main]

jobs:
  deployment-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Vercel frontend boundary
        run: |
          grep -q '"framework": "vite"' vercel.json
          grep -q 'frontend/dist' vercel.json
          grep -q '"deploymentEnabled": false' vercel.json
          ! grep -R -E 'DATABASE_URL|REDIS_URL|INTEGRATION_ENCRYPTION_KEY|MODEL_PROVIDER_API_KEY|AI_PROVIDER_API_KEY' frontend
      - name: Verify Render process boundaries
        run: |
          grep -q 'name: audoryn-api' infrastructure/render/render.yaml
          ! grep -q 'name: audoryn-worker' infrastructure/render/render.yaml
          ! grep -q 'name: audoryn-outbox' infrastructure/render/render.yaml
          ! grep -q 'name: audoryn-scheduler' infrastructure/render/render.yaml
          grep -q 'QSTASH_OUTBOX_DRAIN_URL' infrastructure/render/render.yaml
          grep -q 'QSTASH_RUNTIME_EXECUTE_URL' infrastructure/render/render.yaml
          grep -q 'QSTASH_RUNTIME_SWEEP_URL' infrastructure/render/render.yaml
          grep -q 'CUTOVER_STAGE' infrastructure/render/render.yaml
          grep -q 'RUNTIME_EXECUTION_ENABLED' infrastructure/render/render.yaml
          grep -q 'DATABASE_MIGRATE_ON_STARTUP' infrastructure/render/render.yaml
          grep -q 'AI_PROVIDER_API_KEY' infrastructure/render/render.yaml
          grep -q 'AI_PROVIDER_BASE_URL' infrastructure/render/render.yaml
          grep -q 'AI_COORDINATOR_MODEL' infrastructure/render/render.yaml
          grep -q 'AI_VISION_MODEL' infrastructure/render/render.yaml
          ! grep -q 'MODEL_PROVIDER_' infrastructure/render/render.yaml
