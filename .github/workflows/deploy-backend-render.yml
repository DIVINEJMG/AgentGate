name: Deploy backend to Render

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Check Render deployment configuration
        id: render
        shell: bash
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Render deploy hook is not configured; skipping backend deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Render deployment
        if: steps.render.outputs.configured == 'true'
        shell: bash
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
