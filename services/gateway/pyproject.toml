[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "audoryn-gateway"
version = "0.1.0"
description = "The Audoryn Gateway: the single public entry point in front of AgentGate's services."
requires-python = ">=3.13"
# The same libraries and ranges as the backend: the gateway adds no new dependency.
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "redis>=6.4,<7",
  "starlette>=0.47,<2",  # its CORS middleware, the same the core uses through FastAPI
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "fastapi>=0.116,<1",
  "pyright>=1.1.405,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.13,<1",
]

[tool.setuptools.packages.find]
include = ["audoryn_gateway*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

# The backend's settings, so both services follow one standard.
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["audoryn_gateway", "tests"]
