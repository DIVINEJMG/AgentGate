[project]
name = "audoryn-shared"
version = "26.2.0"
description = "AgentGate's shared code, used by the core API and the execution service: settings, database, domain, planner, providers, coordination"
requires-python = ">=3.13"
# The libraries every AgentGate service needs. Install with the service (see backend/README.md);
# the services do not name this package as a dependency, so pip never looks for it on an index.
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "boto3>=1.40,<2",
  "cryptography>=45,<47",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "pypdf>=6,<7",
  "openpyxl>=3.1,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "redis>=6.4,<7",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "tzdata>=2025,<2027",
  "uvicorn[standard]>=0.35,<1"
]

[project.optional-dependencies]
# Coding sessions (E2B): the core cancels them and the execution service runs them.
coding = ["e2b==2.52.1"]

[tool.setuptools.packages.find]
include = ["audoryn_shared*"]

# The backend's settings, so every package follows one standard.
[tool.ruff]
extend = "../../backend/pyproject.toml"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"
