services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: audoryn
      POSTGRES_USER: audoryn
      POSTGRES_PASSWORD: audoryn
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audoryn -d audoryn"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - audoryn-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: audoryn
      MINIO_ROOT_PASSWORD: audoryn-local-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - audoryn-minio:/data

volumes:
  audoryn-postgres:
  audoryn-minio:
